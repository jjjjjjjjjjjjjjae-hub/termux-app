name: Almas Termux ASM - Auto APK

on:
  push:
    branches:
      - master
      - almas-asm-package-migration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: almas-termux-asm-apk
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already include Android SDK.
      # Do not run setup-android here: its old "sdkmanager tools" install
      # fails because the standalone "tools" package is no longer available.
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build Termux APK (debug)
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
        run: ./gradlew --no-daemon assembleDebug
      - name: Locate universal APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*universal*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Universal APK not found"
            find app/build/outputs/apk -type f -maxdepth 4
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/Almas-Termux-ASM-universal.apk
          cd release
          sha256sum Almas-Termux-ASM-universal.apk > SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Almas-Termux-ASM-${{ github.sha }}
          path: |
            release/Almas-Termux-ASM-universal.apk
            release/SHA256SUMS.txt
          retention-days: 30
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          TAG="asm-build-${RUN_NUMBER}"
          gh release create "$TAG" \
            release/Almas-Termux-ASM-universal.apk \
            release/SHA256SUMS.txt \
            --title "Almas Termux ASM build ${RUN_NUMBER}" \
            --notes "Automated debug-signed build from commit ${SHORT_SHA}. Runtime bootstrap validation is separate; cannot update official Termux signed by upstream." \
            --prerelease
